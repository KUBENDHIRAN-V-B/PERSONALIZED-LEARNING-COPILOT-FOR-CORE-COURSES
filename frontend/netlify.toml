[build]
  command = "npm run build"
  publish = "dist"

[dev]
  command = "npm run dev"
  port = 5173
  targetPort = 8000 # Proxy to backend during local dev if using netlify dev

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

# Example proxying /api calls to your deployed backend (if you have one)
